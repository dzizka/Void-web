<div class="obsah">

    <h1 class="nadpis-sekcie">AJAX & JSON</h1>
    <p class="popis-sekcie">Dáta sú načítané asynchrónne zo súboru <strong>data.json</strong> pomocou AJAX technológie.</p>

    <br>
    <button class="tlacidlo" onclick="nacitajData()">Načítať dáta zo JSON</button>
    <br><br>

    <p id="stav" style="color:#888888; font-size:14px;"></p>

    <div id="tabulka"></div>

<script src="../js/main.js"></script>

<script>
    function nacitajData() {

        document.getElementById("stav").textContent = "Načítavam dáta...";

        var xhr = new XMLHttpRequest();

        xhr.open("GET", "../data.json", true);

        xhr.onload = function() {

            if (xhr.status === 200) {

                var data = JSON.parse(xhr.responseText);

                document.getElementById("stav").textContent = "Načítané " + data.length + " záznamov.";

                vykreslTabulku(data);

            } else {
                document.getElementById("stav").textContent = "Chyba pri načítaní súboru.";
            }
        };

        xhr.send();
    }

    function vykreslTabulku(data) {

        var html = "<table>";

        html = html + "<thead><tr>";
        html = html + "<th>Názov</th>";
        html = html + "<th>Rok</th>";
        html = html + "<th>Typ</th>";
        html = html + "<th>Režisér</th>";
        html = html + "<th>Žánre</th>";
        html = html + "<th>IMDB</th>";
        html = html + "<th>Rotten Tomatoes</th>";
        html = html + "</tr></thead>";

        html = html + "<tbody>";

        for (var i = 0; i < data.length; i++) {
            var film = data[i];

            var zanre = film.info.zanre.join(", ");

            html = html + "<tr>";
            html = html + "<td>" + film.nazov + "</td>";
            html = html + "<td>" + film.rok + "</td>";
            html = html + "<td>" + film.typ + "</td>";
            html = html + "<td>" + film.info.reziser + "</td>";      // úroveň 2
            html = html + "<td>" + zanre + "</td>";                   // úroveň 2
            html = html + "<td>" + film.info.hodnotenie.imdb + "</td>"; // úroveň 3
            html = html + "<td>" + film.info.hodnotenie.rt + "%</td>";  // úroveň 3
            html = html + "</tr>";
        }

        html = html + "</tbody></table>";

        document.getElementById("tabulka").innerHTML = html;
    }
</script>

</body>
